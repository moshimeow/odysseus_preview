[package]
name = "odysseus-slam"
version = "0.1.0"
edition = "2021"

[features]
aprilgrid = ["dep:aprilgrid", "dep:image"]

[dependencies]
odysseus-solver = { path = "../odysseus-solver", features = ["visualization"] }
num-traits = "0.2"
nalgebra = "0.32"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rerun = "0.27.2"
clap = { version = "4.5", features = ["derive"] }
sprs = "0.11.4"
aprilgrid = { version = "0.8.0", optional = true }
image = { version = "0.25", optional = true }


[dev-dependencies]
approx = "0.5"
backtrace-on-stack-overflow = "0.1.0"
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
odysseus-slam-frontend = { path = "../odysseus-slam-frontend" }
exr = "1.7"
