[package]
name = "odysseus-slam"
version = "0.1.0"
edition = "2021"

[features]
aprilgrid = ["odysseus-camera/aprilgrid"]

[dependencies]
odysseus-solver = { path = "../odysseus-solver", features = ["visualization"] }
odysseus-camera = { path = "../odysseus-camera" }
odysseus-imu = { path = "../odysseus-imu" }
num-traits = "0.2"
nalgebra = "0.32"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
rerun = "0.32"
clap = { version = "4.5", features = ["derive"] }
sprs = "0.11.4"


[dev-dependencies]
approx = "0.5"
backtrace-on-stack-overflow = "0.1.0"
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
odysseus-slam-frontend = { path = "../odysseus-slam-frontend" }
exr = "1.7"
