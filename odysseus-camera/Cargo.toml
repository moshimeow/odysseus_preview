[package]
name = "odysseus-camera"
version = "0.1.0"
edition = "2021"

[features]
aprilgrid = ["dep:aprilgrid", "dep:image"]
calibrate-ds-bin = ["aprilgrid", "dep:clap", "dep:serde", "dep:serde_json"]

[dependencies]
odysseus-solver = { path = "../odysseus-solver" }
nalgebra = "0.32"
aprilgrid = { version = "0.8.0", optional = true }
image = { version = "0.25", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
approx = "0.5"
rand = "0.8"
rand_chacha = "0.3"

[[bin]]
name = "calibrate_ds"
required-features = ["calibrate-ds-bin"]
